# The review bot's rubric (ReviewBot_1.5). The bot runs from Aptix-Bio/governance at the commit
# .github/workflows/review.yml pins, and loads this file from Iris-Headers' default branch, never
# from the pull request under review, so a pull request cannot change the rules it is judged by.
# The shared items come first, in the family's shared order, with the text this repository adds
# to each under [shared_guidance]; this repository's own items follow, kept privately with its
# plans so that a merged pull request cannot remove them (decided 2026-11-28), and this file
# holds none. One checkbox per item in the pull request's "Agent review" section.
#
# An item passes, fails, or does not apply. A failed item with blocking = true fails the
# `code-review` check; a failed advisory item is reported only. Changing this file changes what
# every later pull request is held to: it is a code-owner file (.github/CODEOWNERS) and its own
# pull request says why.
#
# The family's general conventions, the shared items, and this repository's work breakdown,
# requirement rows and errata are kept privately; the bot reads them from its own checkout. They
# are named here by file name only (PlansPrivate_7.4, decided 2026-11-27).

[review]
product = "Iris-Headers, the shared public C++ headers of the Iris file format and slide libraries (types, Result, Buffer, the lock-free queue, SIMD helpers), MIT-licensed"
# This repository's own documents, read whole from the default branch; a missing one fails the
# review. ARCHITECTURE.md is sent whole because a header change is judged against the target (§3)
# and the decisions (§4) as much as against the work item it names; README.md holds the ID
# scheme; CONTRIBUTING.md and PIPELINE.md this repository's own rules.
reference_files = [
    "development/ARCHITECTURE.md",
    "development/PIPELINE.md",
    "development/README.md",
    "CONTRIBUTING.md",
]
# The family's general conventions, sent whole.
shared_reference_files = ["style_guide.md", "ci_runners.md", "planning.md", "public_repositories.md"]
# The shared items, in the shared order. ClinicalIntegrity is left out: nothing here changes what
# a pathologist sees.
shared_items = [
    "Traceability",
    "StyleGuide",
    "MinimumSurface",
    "TestsFirst",
    "AbiAndConsumers",
    "PublicRepository",
    "SecurityImpact",
    "Pipeline",
    "DataProtection",
    "Documentation",
    "AgentDisclosure",
]
# This repository's errata, sent whole; its work breakdown and requirement rows, sent as the items
# and rows a pull request names (the bold ID, `**StrongIndices_4.2**`, with the lines nested under
# it), since they change in almost every pull request and sent whole would end the cached prefix.
plan_reference_files = ["ERRATA.md"]
plan_excerpt_files = ["WBS.md", "RTM.md"]

[shared_guidance]
Traceability = """
Iris-Headers' IDs are spelled out in full (`StandaloneHeaderBuild_1.1`; development/README.md,
Identifiers). The description names the work items it completes or advances, the requirement rows
it touches, and the ARCHITECTURE.md §4 decision it implements, if any. A tick or row links a commit
of this pull request or of `main`, `[1234567](https://github.com/Aptix-Bio/Iris-Headers/commit/<full hash>)`.
Code that implements a row carries its `// RTM <ID>` or `# RTM <ID>` tag.
"""
StyleGuide = """
Iris-Headers' own rules are CONTRIBUTING.md; they win where they are more specific. Its boundary
returns `Iris::Result` with `Iris::Domain::IRIS_HEADERS` and an `Iris::HeadersError` code
(CONTRIBUTING.md, rule 10).
"""
MinimumSurface = """
`Iris::Result`, `Iris::Buffer`, `Iris::FIFO::Queue`, `Iris::Async::Pool` and `Iris::Memory` are
reused; a re-implementation of one fails. Iris-Headers holds the shared vocabulary (ARCHITECTURE.md §3,
VocabularyScopeQuestion_1; CONTRIBUTING.md, rule 8): a project's own API, a graphics API, a
binding's glue or another project's dependency pins added here fail.
"""
TestsFirst = """
The tests here are the type tests in tests/, the standalone-header check, and a `cmake -P` test
under cmake/tests/ for a CMake script (CONTRIBUTING.md, rule 15).
"""
AbiAndConsumers = """
A change to anything a consumer compiles (a public type, a member, an enumeration value, a
layout, a function signature, a header's name or location) states under "Consumer impact" what
each consumer (Iris-File-Extension and Iris-Slide) must change, and the `downstream` cells for
both show they build and pass against it (PIPELINE.md, rule 3). Enumeration values that mirror the
Iris File Extension specification (MetadataType, the tile and image encodings, the formats) stay
equal to IFE's: a renumbered or reordered value fails. A breaking change follows
BreakingReleaseQuestion_4 (one breaking release, every consumer moved in step). A coordinated
breaking change names each consumer's pull request and the order of the merges in its
description, since merging this repository first breaks each consumer's `main` (CONTRIBUTING.md,
rules 4 to 7).
"""
PublicRepository = """
Iris-Headers is public under MIT. Aptix-Bio/governance may be named as the source of the review
bot in .github/ and the documents describing the review. The open-source slide library is
Iris-Slide (renamed 2026-11-24, ARCHITECTURE.md); a line written after the rename does not call it
Iris-Codec. A line that only keeps a name already on the line it edits is judged as it was.
"""
Pipeline = """
development/PIPELINE.md holds this repository's pipeline rules. Every job has a pinned Blacksmith
label (`cmake/check_runner_labels.cmake`); `pull_request_target` appears only in review.yml, whose
safety properties `cmake/check_review_configuration.cmake` holds; a job that needs a variable or
secret checks it first (`cmake/require_settings.cmake`).
"""
Documentation = """
The repository's README.md stays true to how a consumer fetches and links the headers.
"""

[trace]
# Every tick in the work breakdown, and every requirement row at these statuses, that the pull
# request names links the GitHub commit that did the work; a line that does not fails `item`.
# Both files are kept privately and read from the bot's checkout. Checked by the bot itself.
item = "Traceability"
ticks = []
rows = []
row_statuses = ["Implemented", "Verified"]
plan_ticks = ["WBS.md"]
plan_rows = ["RTM.md"]

[verification]
# One maintainer: the pull request's author may give the final human verification until a second
# maintainer joins.
allow_author = true
