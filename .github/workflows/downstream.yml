# DownstreamBuild_1.2 (SafetyNet_1; development/PIPELINE.md, rules 3 to 5).
#
# A header change is correct only relative to what consumes it, so this builds
# the consumers against the change, and against the base when that fails (the
# control run), on every pull request and every push to main. The verdict per
# consumer cell is cmake/downstream_verdict.cmake's, stated at its top: a
# change that breaks a consumer fails, a consumer already broken against the
# base warns, and a configure failure against the base fails as broken tooling.
# Each consumer is built from its branch named like the pull request's head
# when it has one (a coordinated change), else from main, and then from main
# as well, so a change green only on a paired branch fails before it merges
# (ReviewBot_1.5, after every consumer cell failed on main on 2026-11-24). No secret is used here; the
# consumers' own CI is triggered only when a pull request merges
# (trigger-downstream.yml).
#
# BlacksmithRunners_1.4: every job runs on a Blacksmith runner (decided
# 2026-11-24, when GitHub-hosted jobs stopped starting over billing) at the
# labels documented in https://docs.blacksmith.sh/blacksmith-runners/overview
# (read 2026-11-24), each the OS version the GitHub-hosted cell ran: Linux on
# blacksmith-2vcpu-ubuntu-2404 (8 GB), Windows on blacksmith-2vcpu-windows-2025
# (7 GB; public beta, Visual Studio Build Tools 2022 with the ClangCL
# toolset), macOS on blacksmith-6vcpu-macos-15 (Apple M4, GitHub's macos-15
# image). cmake/check_runner_labels.cmake fails on any other label.
name: downstream

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: downstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-labels:
    name: Workflow rules (runner labels, downstream verdict, review configuration)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every job on a pinned Blacksmith runner (BlacksmithRunners_1.4)
        run: cmake -P cmake/check_runner_labels.cmake
      - name: The downstream verdict fails a change green only on a paired branch (ReviewBot_1.5)
        run: cmake -P cmake/tests/downstream_verdict_test.cmake
      - name: The review bot's workflow keeps its safety properties (ReviewBot_1.5)
        run: cmake -P cmake/check_review_configuration.cmake

  standalone-headers:
    name: Headers compile alone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-2vcpu-ubuntu-2404, configure: "-G Ninja -DCMAKE_CXX_COMPILER=clang++" }
          - { os: blacksmith-6vcpu-macos-15, configure: "-G Ninja -DCMAKE_CXX_COMPILER=clang++" }
          # The default Visual Studio generator with its ClangCL toolset, the Windows compiler the Iris
          # consumers build with.
          - { os: blacksmith-2vcpu-windows-2025, configure: "-T ClangCL" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ninja-build
      - name: Build the standalone-header check with Clang
        env:
          CONFIGURE: ${{ matrix.configure }}
        run: |
          # shellcheck disable=SC2086  # CONFIGURE is a list of flags from the matrix
          cmake -S . -B build $CONFIGURE -DIRIS_HEADERS_CHECK_STANDALONE=ON
          cmake --build build --config Release

  type-tests:
    name: Type tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-2vcpu-ubuntu-2404, configure: "-G Ninja -DCMAKE_CXX_COMPILER=clang++" }
          - { os: blacksmith-6vcpu-macos-15, configure: "-G Ninja -DCMAKE_CXX_COMPILER=clang++" }
          # The first build of MemoryArena's Windows path (WindowsPaths_4.7).
          - { os: blacksmith-2vcpu-windows-2025, configure: "-T ClangCL" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ninja-build
      - name: Build and run the type tests (TypeTests_1.3)
        env:
          CONFIGURE: ${{ matrix.configure }}
        run: |
          # shellcheck disable=SC2086  # CONFIGURE is a list of flags from the matrix
          cmake -S . -B build $CONFIGURE -DCMAKE_BUILD_TYPE=Release -DIRIS_HEADERS_BUILD_TYPE_TESTS=ON
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure --no-tests=error

  consumer:
    name: ${{ matrix.consumer }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # IFE: self-contained and fast; Windows is where macro collisions bite.
          - { consumer: Iris-File-Extension, os: blacksmith-2vcpu-ubuntu-2404, test: true,
              options: "-DIFE_BUILD_TESTS=ON" }
          - { consumer: Iris-File-Extension, os: blacksmith-6vcpu-macos-15, test: true,
              options: "-DIFE_BUILD_TESTS=ON" }
          - { consumer: Iris-File-Extension, os: blacksmith-2vcpu-windows-2025, test: true,
              options: "-DIFE_BUILD_TESTS=ON" }
          # Iris-Slide: decoder only, a build check; the encoder pulls OpenSlide
          # and libdicom. Its dependencies come from its vcpkg.json; this change
          # and its IFE reach it as overlay ports (cmake/downstream_verdict.cmake).
          - { consumer: Iris-Slide, os: blacksmith-2vcpu-ubuntu-2404, test: false,
              options: "-DIRIS_BUILD_ENCODER=OFF;-DIRIS_USE_OPENSLIDE=OFF;-DIRIS_BUILD_PYTHON=OFF" }
          - { consumer: Iris-Slide, os: blacksmith-6vcpu-macos-15, test: false,
              options: "-DIRIS_BUILD_ENCODER=OFF;-DIRIS_USE_OPENSLIDE=OFF;-DIRIS_BUILD_PYTHON=OFF" }
    defaults:
      run:
        shell: bash
    steps:
      - name: This change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: change
          persist-credentials: false
      - name: The base (control)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
          persist-credentials: false
      # Meson for the IFE cell; NASM and pkg-config for the ports Iris-Slide's vcpkg.json builds
      # (aom needs NASM on x64 Linux, which vcpkg does not fetch: "Could not find nasm").
      - name: Install Ninja and Meson (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ninja-build meson nasm pkg-config
      - name: Install Meson (macOS)
        if: runner.os == 'macOS'
        run: brew install meson
      # The verdict, in one CMake script for both consumers: each consumer (and Iris-Slide's IFE)
      # is cloned at its paired branch, else main; when a paired branch was used and the change
      # is green on it, the consumer's main is built too, so a change that breaks main on merge
      # fails here (ReviewBot_1.5, after every consumer cell failed on main on 2026-11-24). The head branch is text the
      # author chose, so it reaches the script through the environment.
      - name: ${{ matrix.consumer }} against the change, then the base
        env:
          CONSUMER: ${{ matrix.consumer }}
          OPTIONS: ${{ matrix.options }}
          RUN_TESTS: ${{ matrix.test }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: cmake -DCONSUMER="$CONSUMER" -DCHANGE=change -DBASE=base -DOPTIONS="$OPTIONS" -DTEST="$RUN_TESTS" -P change/cmake/downstream_verdict.cmake
