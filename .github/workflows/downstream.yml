# DownstreamBuild_1.2 (development/MODERNIZATION.md, SafetyNet_1).
#
# A header change is correct only relative to what consumes it, so this builds
# the consumers against the change, and against the base when that fails (the
# control run), on every pull request and every push to main. Verdict per
# consumer cell:
#   change green                              -> pass
#   change red, base green                    -> this change broke it: fail
#   change red, base red at build or test     -> already broken: warn, pass
#   any configure failure                     -> the cell's tooling is broken: fail
# Each consumer is built from its branch named like the pull request's head
# when it has one (a coordinated change), else from main.
# Failing on configure keeps a cell that cannot build anything from passing as
# "already broken". No secret is used here; the consumers' own CI is triggered
# only when a pull request merges (trigger-downstream.yml).
#
# BlacksmithRunners_1.4: every job runs on a Blacksmith runner (decided
# 2026-11-24, when GitHub-hosted jobs stopped starting over billing) at the
# labels documented in https://docs.blacksmith.sh/blacksmith-runners/overview
# (read 2026-11-24), each the OS version the GitHub-hosted cell ran: Linux on
# blacksmith-2vcpu-ubuntu-2404 (8 GB), Windows on blacksmith-2vcpu-windows-2025
# (7 GB; public beta, Visual Studio Build Tools 2022 with the ClangCL
# toolset), macOS on blacksmith-6vcpu-macos-15 (Apple M4, GitHub's macos-15
# image). cmake/check_runner_labels.cmake fails on any other label.
name: downstream

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: downstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-labels:
    name: Runner labels are pinned Blacksmith labels
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every job on a pinned Blacksmith runner (BlacksmithRunners_1.4)
        run: cmake -P cmake/check_runner_labels.cmake

  standalone-headers:
    name: Headers compile alone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-2vcpu-ubuntu-2404, configure: "-G Ninja -DCMAKE_CXX_COMPILER=clang++" }
          - { os: blacksmith-6vcpu-macos-15, configure: "-G Ninja -DCMAKE_CXX_COMPILER=clang++" }
          # The default Visual Studio generator with its ClangCL toolset (Iris-Core D38).
          - { os: blacksmith-2vcpu-windows-2025, configure: "-T ClangCL" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ninja-build
      - name: Build the standalone-header check with Clang
        env:
          CONFIGURE: ${{ matrix.configure }}
        run: |
          # shellcheck disable=SC2086  # CONFIGURE is a list of flags from the matrix
          cmake -S . -B build $CONFIGURE -DIRIS_HEADERS_CHECK_STANDALONE=ON
          cmake --build build --config Release

  type-tests:
    name: Type tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-2vcpu-ubuntu-2404, configure: "-G Ninja -DCMAKE_CXX_COMPILER=clang++" }
          - { os: blacksmith-6vcpu-macos-15, configure: "-G Ninja -DCMAKE_CXX_COMPILER=clang++" }
          # The first build of MemoryArena's Windows path (WindowsPaths_4.7).
          - { os: blacksmith-2vcpu-windows-2025, configure: "-T ClangCL" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ninja-build
      - name: Build and run the type tests (TypeTests_1.3)
        env:
          CONFIGURE: ${{ matrix.configure }}
        run: |
          # shellcheck disable=SC2086  # CONFIGURE is a list of flags from the matrix
          cmake -S . -B build $CONFIGURE -DCMAKE_BUILD_TYPE=Release -DIRIS_HEADERS_BUILD_TYPE_TESTS=ON
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure --no-tests=error

  consumer:
    name: ${{ matrix.consumer }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # IFE: self-contained and fast; Windows is where macro collisions bite.
          - { consumer: Iris-File-Extension, os: blacksmith-2vcpu-ubuntu-2404, test: true,
              options: "-DIFE_BUILD_TESTS=ON" }
          - { consumer: Iris-File-Extension, os: blacksmith-6vcpu-macos-15, test: true,
              options: "-DIFE_BUILD_TESTS=ON" }
          - { consumer: Iris-File-Extension, os: blacksmith-2vcpu-windows-2025, test: true,
              options: "-DIFE_BUILD_TESTS=ON" }
          # Iris-Slide: decoder only, a build check; the encoder pulls OpenSlide
          # and libdicom. Its dependencies come from its vcpkg.json; this change
          # and its IFE reach it as overlay ports (cmake/downstream_verdict.cmake).
          - { consumer: Iris-Slide, os: blacksmith-2vcpu-ubuntu-2404, test: false,
              options: "-DIRIS_BUILD_ENCODER=OFF;-DIRIS_USE_OPENSLIDE=OFF;-DIRIS_BUILD_PYTHON=OFF" }
          - { consumer: Iris-Slide, os: blacksmith-6vcpu-macos-15, test: false,
              options: "-DIRIS_BUILD_ENCODER=OFF;-DIRIS_USE_OPENSLIDE=OFF;-DIRIS_BUILD_PYTHON=OFF" }
    defaults:
      run:
        shell: bash
    steps:
      - name: This change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: change
          persist-credentials: false
      - name: The base (control)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
          persist-credentials: false
      # A breaking change is made in each repository on a branch of the same
      # name, and none can merge first. So the consumer is built from its
      # branch named like this pull request's head when it has one (the
      # paired branch), else from main. The branch name reaches the shell
      # through the environment, since a branch name is attacker-chosen text.
      - name: The consumer's ref (its paired branch, else main)
        id: consumer-ref
        env:
          CONSUMER: Aptix-Bio/${{ matrix.consumer }}
          HEAD_REF: ${{ github.head_ref }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          ref=main
          if [[ -n "$HEAD_REF" ]] && git ls-remote --exit-code --heads "https://github.com/$CONSUMER.git" "refs/heads/$HEAD_REF" > /dev/null; then
            ref="$HEAD_REF"
          fi
          echo "$CONSUMER at $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: The consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Aptix-Bio/${{ matrix.consumer }}
          ref: ${{ steps.consumer-ref.outputs.ref }}
          path: consumer
          persist-credentials: false
      # Iris-Slide fetches Iris-File-Extension itself, at its main, which builds
      # only against the base when the change renames what IFE includes. Its
      # IFE is therefore checked out here, at IFE's paired branch when it has
      # one (else main), and handed to its build in place of the fetch.
      - name: Iris-Slide's IFE (its paired branch, else main)
        if: matrix.consumer == 'Iris-Slide'
        env:
          HEAD_REF: ${{ github.head_ref }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          ife=https://github.com/Aptix-Bio/Iris-File-Extension.git
          ref=main
          if [[ -n "$HEAD_REF" ]] && git ls-remote --exit-code --heads "$ife" "refs/heads/$HEAD_REF" > /dev/null; then
            ref="$HEAD_REF"
          fi
          echo "Aptix-Bio/Iris-File-Extension at $ref"
          git clone --quiet --depth 1 --branch "$ref" "$ife" ife
          echo "IFE_SOURCE=$PWD/ife" >> "$GITHUB_ENV"
      # Meson for the IFE cell; NASM and pkg-config for the ports Iris-Slide's vcpkg.json builds
      # (aom needs NASM on x64 Linux, which vcpkg does not fetch: "Could not find nasm").
      - name: Install Ninja and Meson (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ninja-build meson nasm pkg-config
      - name: Install Meson (macOS)
        if: runner.os == 'macOS'
        run: brew install meson
      # Iris-Slide (VcpkgCaching_2): the verdict below, in a CMake script, through
      # Iris-Slide's overlay ports of this change and of its IFE.
      - name: Iris-Slide against the change, then the base
        if: matrix.consumer == 'Iris-Slide'
        env:
          OPTIONS: ${{ matrix.options }}
        run: cmake -DCONSUMER=consumer -DCHANGE=change -DBASE=base -DIFE="$IFE_SOURCE" -DOPTIONS="$OPTIONS" -P change/cmake/downstream_verdict.cmake
      - name: Build against the change, then the base
        if: matrix.consumer != 'Iris-Slide'
        env:
          OPTIONS: ${{ matrix.options }}
          RUN_TESTS: ${{ matrix.test }}
        run: |
          # Clang everywhere (Iris-Core D38): clang-cl through the default Visual
          # Studio generator's ClangCL toolset on Windows.
          generator=(-G Ninja -DCMAKE_CXX_COMPILER=clang++)
          if [[ "$RUNNER_OS" == "Windows" ]]; then generator=(-T ClangCL); fi
          # Exit codes: 0 green, 1 red at build or test, 2 red at configure.
          build() {
            local headers="$1" out="$2"
            local ife=()
            if [[ -n "${IFE_SOURCE:-}" ]]; then ife=(-DFETCHCONTENT_SOURCE_DIR_IRISFILEEXTENSION="$IFE_SOURCE"); fi
            # shellcheck disable=SC2086  # OPTIONS is a list of -D flags from the matrix
            cmake -S consumer -B "$out" "${generator[@]}" -DCMAKE_BUILD_TYPE=Release \
              -DFETCHCONTENT_SOURCE_DIR_IRISHEADERS="$PWD/$headers" "${ife[@]}" $OPTIONS || return 2
            cmake --build "$out" --config Release --parallel || return 1
            if [[ "$RUN_TESTS" == "true" ]]; then
              ctest --test-dir "$out" -C Release --output-on-failure --no-tests=error || return 1
            fi
          }
          change=0; build change build-change || change=$?
          if [[ $change -eq 0 ]]; then echo "change: green"; exit 0; fi
          if [[ $change -eq 2 ]]; then
            echo "::error::The consumer does not configure against the change: the cell's tooling is broken."
            exit 1
          fi
          echo "change: red at build or test"
          base=0; build base build-base || base=$?
          if [[ $base -eq 0 ]]; then
            echo "::error::This change breaks the consumer: it builds against the base and fails against the change."
            exit 1
          fi
          if [[ $base -eq 2 ]]; then
            echo "::error::The consumer does not configure against the base: the cell's tooling is broken."
            exit 1
          fi
          echo "::warning::The consumer fails against the base too: already broken, not blocked by this change."
